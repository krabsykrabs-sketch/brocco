name: CI

# main auto-deploys to production via Coolify — this gate is the only thing
# standing between a broken commit and live users.
on:
  push:
    branches: [main, life-planner]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Dummy values — nothing here connects to real services. `next build`
      # and `prisma generate` only need the variables to exist.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SESSION_SECRET: ci-only-dummy-secret-0123456789abcdef
      ANTHROPIC_API_KEY: ci-dummy
      GROQ_API_KEY: ci-dummy
      STRAVA_CLIENT_ID: "0"
      STRAVA_CLIENT_SECRET: ci-dummy
      STRAVA_WEBHOOK_VERIFY_TOKEN: ci-dummy
      BASE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      # Non-blocking for now: `eslint src` has 14 pre-existing errors
      # (react-hooks/refs, set-state-in-effect, ...). Flip to blocking by
      # removing continue-on-error once those are down to zero.
      - name: Lint (non-blocking until baseline is clean)
        run: npx eslint src
        continue-on-error: true

      - name: Recurrence fixture tests
        run: npx tsx scripts/dev-check-recurrence.ts

      - name: Recurrence fixture tests (hostile timezone)
        run: TZ=Pacific/Kiritimati npx tsx scripts/dev-check-recurrence.ts

      - name: Build
        run: npx next build
